[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtools"
dynamic = ["version"]
description = "Useful scripts to parse and visualize MongoDB log files, launch test environments, and reproduce issues."
readme = "README.rst"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Thomas Rueckstiess", email = "thomas@rueckstiess.net"}]
keywords = ["MongoDB", "logs", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
all = [
    "numpy>=1.21.6",
    "matplotlib>=3.5.3,<4.0.0",
    "pymongo>=4.3.2,<5.0.0",
    "psutil>=5.9.3,<6.0.0",
    "packaging>=21.3",
    "python-dateutil>=2.8.2,<3.0.0",
]
mlaunch = [
    "pymongo>=4.3.2,<5.0.0",
    "psutil>=5.9.3,<6.0.0",
    "packaging>=21.3",
    "python-dateutil>=2.8.2,<3.0.0",
]
mlogfilter = ["python-dateutil>=2.8.2,<3.0.0"]
mloginfo = ["numpy>=1.21.6", "python-dateutil>=2.8.2,<3.0.0"]
mplotqueries = [
    "numpy>=1.21.6",
    "matplotlib>=3.5.3,<4.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
]
mtransfer = [
    "pymongo>=4.3.2,<5.0.0",
    "wiredtiger>=3.2.1",
    "python-dateutil>=2.8.2,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/rueckstiess/mtools"

[project.scripts]
mlaunch = "mtools.mlaunch.mlaunch:main"
mlogfilter = "mtools.mlogfilter.mlogfilter:main"
mloginfo = "mtools.mloginfo.mloginfo:main"
mplotqueries = "mtools.mplotqueries.mplotqueries:main"
mtransfer = "mtools.mtransfer.mtransfer:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "mtools.version.__version__"}

[tool.setuptools.packages.find]
include = ["mtools*"]
exclude = ["mtools.test*"]

[tool.setuptools.package-data]
mtools = ["data/*"]
