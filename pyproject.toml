[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mtools"
dynamic = ["version"]
description = "Useful scripts to parse and visualize MongoDB log files, launch test environments, and reproduce issues."
readme = "README.rst"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Thomas Rueckstiess", email = "thomas@rueckstiess.net"}]
keywords = ["MongoDB", "logs", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.optional-dependencies]
all = [
    "numpy>=2.2,<2.6; python_version < '3.15'",
    "numpy>=2.5.2,<2.6; python_version >= '3.15'",
    "matplotlib>=3.8,<4.0.0; python_version < '3.15'",
    "matplotlib>=3.11.2,<4.0.0; python_version >= '3.15'",
    "pymongo>=4.18.3,<5.0.0",
    "psutil>=6,<8",
    "packaging>=24",
    "python-dateutil>=2.9.0,<3.0.0",
]
mlaunch = [
    "pymongo>=4.18.3,<5.0.0",
    "psutil>=6,<8",
    "packaging>=24",
    "python-dateutil>=2.9.0,<3.0.0",
]
mlogfilter = ["python-dateutil>=2.9.0,<3.0.0"]
mloginfo = [
    "numpy>=2.2,<2.6; python_version < '3.15'",
    "numpy>=2.5.2,<2.6; python_version >= '3.15'",
    "python-dateutil>=2.9.0,<3.0.0",
]
mplotqueries = [
    "numpy>=2.2,<2.6; python_version < '3.15'",
    "numpy>=2.5.2,<2.6; python_version >= '3.15'",
    "matplotlib>=3.8,<4.0.0; python_version < '3.15'",
    "matplotlib>=3.11.2,<4.0.0; python_version >= '3.15'",
    "python-dateutil>=2.9.0,<3.0.0",
]
mtransfer = [
    "pymongo>=4.18.3,<5.0.0",
    "wiredtiger>=3.2.1",
    "python-dateutil>=2.9.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/rueckstiess/mtools"

[project.scripts]
mlaunch = "mtools.mlaunch.mlaunch:main"
mlogfilter = "mtools.mlogfilter.mlogfilter:main"
mloginfo = "mtools.mloginfo.mloginfo:main"
mplotqueries = "mtools.mplotqueries.mplotqueries:main"
mtransfer = "mtools.mtransfer.mtransfer:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "mtools.version.__version__"}

[tool.setuptools.packages.find]
include = ["mtools*"]
exclude = ["mtools.test*"]

[tool.setuptools.package-data]
mtools = ["data/*"]
